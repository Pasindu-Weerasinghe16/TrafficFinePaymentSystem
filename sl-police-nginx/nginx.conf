events {}

http {
  upstream sl_police_monolith {
    server sl-police-monolith:8081;
  }

  server {
    listen 80;
    location / {
      proxy_pass http://sl_police_monolith;
      proxy_http_version 1.1;
      # Send a valid Host header. Without this, nginx forwards the upstream name
      # ("sl_police_monolith") whose underscores Tomcat rejects with 400 Bad Request.
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
