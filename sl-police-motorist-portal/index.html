<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SL Police — Traffic Fine Payment Portal</title>
<meta name="description" content="Check and pay your Sri Lanka Police traffic fines online. Fast, secure, and convenient."/>
<link rel="stylesheet" href="index.css"/>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="logo">🛡️ <span>SL Police</span> Fine Payment</div>
    <nav class="header-nav">
      <button class="btn btn-ghost" onclick="startOver()">Check a Fine</button>
    </nav>
  </div>
</header>

<main id="main">

  <!-- SEARCH PAGE -->
  <div id="page-search" class="page active">
    <div class="hero">
      <h1>Check Your Traffic Fine</h1>
      <p>Enter the details printed on your paper ticket to view and pay your fine</p>
    </div>

    <div class="auth-wrap">
      <div class="auth-card">
        <form id="search-form">
          <div class="field">
            <label>Reference Number</label>
            <input type="text" id="s-reference" placeholder="e.g. DEMO-1003" required/>
          </div>
          <div class="field">
            <label>Category ID</label>
            <input type="text" id="s-category" inputmode="numeric" placeholder="e.g. 3" required/>
          </div>
          <div class="field">
            <label>Officer Badge Number</label>
            <input type="text" id="s-badge" placeholder="e.g. OB7788" required/>
          </div>
          <div id="search-err" class="err-msg"></div>
          <button type="submit" id="search-btn" class="btn btn-primary w-full btn-lg">Check Fine</button>
        </form>
      </div>
    </div>

    <div id="search-results" class="results-area"></div>
  </div>

  <!-- PAY FINE MODAL -->
  <div id="pay-modal" class="modal-overlay" onclick="closePayModal(event)">
    <div class="modal-card">
      <button class="modal-close" onclick="closePayModal()">✕</button>
      <h2>Pay Fine</h2>
      <div id="pay-fine-info"></div>
      <form id="pay-form">
        <div class="field"><label>Violation Location</label><input type="text" id="p-location" placeholder="Galle Road, Colombo 03" required/></div>
        <div class="field"><label>Card Number</label><input type="text" id="p-card" placeholder="4111 1111 1111 1111" maxlength="19" required/></div>
        <div class="form-grid-2">
          <div class="field"><label>Expiry</label><input type="text" id="p-expiry" placeholder="MM/YY" maxlength="5" required/></div>
          <div class="field"><label>CVV</label><input type="text" id="p-cvv" placeholder="123" maxlength="4" required/></div>
        </div>
        <div id="pay-err" class="err-msg"></div>
        <button type="submit" id="pay-btn" class="btn btn-success w-full btn-lg">💳 Pay Now</button>
      </form>
    </div>
  </div>

  <!-- SUCCESS PAGE -->
  <div id="page-success" class="page">
    <div class="success-wrap">
      <div class="success-card">
        <div class="success-icon">✅</div>
        <h2>Payment Successful!</h2>
        <p id="success-msg"></p>
        <button class="btn btn-primary" onclick="startOver()">Check Another Fine</button>
      </div>
    </div>
  </div>

</main>

<footer class="footer">
  <p>© 2024 Sri Lanka Police Department — Traffic Fine Payment Portal</p>
</footer>
<script src="app.js"></script>
</body>
</html>
